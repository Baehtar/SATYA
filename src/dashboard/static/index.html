<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satya — Misinformation Trend Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --green: #4cef9a;
      --yellow: #ffd166;
      --red: #ef476f;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --border: rgba(108,99,255,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

    header {
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(108,99,255,0.04);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { font-size: 12px; color: var(--muted); }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .portal-link { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
      padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; transition: color 0.2s, border-color 0.2s; }
    .portal-link:hover { color: var(--text); border-color: var(--accent); }
    .live-badge { background: rgba(76,239,154,0.15); color: var(--green); border: 1px solid rgba(76,239,154,0.3);
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%;
      animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    main { max-width: 1400px; margin: 0 auto; padding: 40px; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; position: relative; overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--accent); opacity: 0.6; }
    .stat-card.red::before { background: var(--red); }
    .stat-card.green::before { background: var(--green); }
    .stat-card.yellow::before { background: var(--yellow); }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .stat-value { font-size: 40px; font-weight: 900; letter-spacing: -2px; }
    .stat-card.red .stat-value { color: var(--red); }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.yellow .stat-value { color: var(--yellow); }

    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .chart-title { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 20px; }

    .feed-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .feed-title { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 20px; }
    .feed-item {
      display: grid; grid-template-columns: auto 1fr auto auto;
      gap: 16px; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    .feed-item:last-child { border-bottom: none; }
    .verdict-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .badge-likely_false { background: rgba(239,71,111,0.15); color: var(--red); }
    .badge-likely_true { background: rgba(76,239,154,0.15); color: var(--green); }
    .badge-unverifiable { background: rgba(255,209,102,0.15); color: var(--yellow); }
    .badge-ai_generated { background: rgba(108,99,255,0.15); color: var(--accent); }
    .badge-manipulated { background: rgba(255,101,132,0.15); color: var(--accent2); }
    .badge-misleading_context { background: rgba(255,140,0,0.15); color: #ff8c00; }
    .badge-authentic_image { background: rgba(76,239,154,0.15); color: var(--green); }
    .feed-claim { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed-type { font-size: 11px; color: var(--muted); }
    .feed-latency { font-size: 11px; color: var(--muted); white-space: nowrap; }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .charts-grid { grid-template-columns: 1fr; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <div>
        <h1>Satya</h1>
        <span>AI Misinformation Forward-Checker</span>
      </div>
    </div>
    <div class="header-right">
      <a class="portal-link" href="/">&larr; Check a forward</a>
      <div class="live-badge"><div class="live-dot"></div> LIVE</div>
    </div>
  </header>

  <main>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Checks</div>
        <div class="stat-value" id="total">—</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">Likely False</div>
        <div class="stat-value" id="false-count">—</div>
      </div>
      <div class="stat-card yellow">
        <div class="stat-label">Unverifiable</div>
        <div class="stat-value" id="unverifiable">—</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Avg. Latency</div>
        <div class="stat-value" id="avg-latency">—</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Verdict Distribution</div>
        <canvas id="verdictChart" height="220"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">Claim Type Breakdown</div>
        <canvas id="claimChart" height="220"></canvas>
      </div>
    </div>

    <div class="feed-card">
      <div class="feed-title">Live Check Feed</div>
      <div id="feed">Loading...</div>
    </div>
  </main>

  <script>
    const VERDICT_COLORS = {
      likely_false: '#ef476f', likely_true: '#4cef9a', unverifiable: '#ffd166',
      ai_generated: '#6c63ff', manipulated: '#ff6584', misleading_context: '#ff8c00',
      authentic_image: '#4cef9a'
    };

    let verdictChart, claimChart;

    async function fetchStats() {
      const r = await fetch('/api/dashboard/stats');
      const d = await r.json();
      document.getElementById('total').textContent = d.total_checks.toLocaleString();
      document.getElementById('false-count').textContent = d.likely_false.toLocaleString();
      document.getElementById('unverifiable').textContent = d.unverifiable.toLocaleString();
      document.getElementById('avg-latency').textContent = d.avg_latency_ms > 0 ? `${(d.avg_latency_ms/1000).toFixed(1)}s` : '—';
    }

    async function fetchTrends() {
      const r = await fetch('/api/dashboard/trends');
      const d = await r.json();

      const vLabels = Object.keys(d.verdict_distribution).map(k => k.replace(/_/g,' '));
      const vData = Object.values(d.verdict_distribution);
      const vColors = Object.keys(d.verdict_distribution).map(k => VERDICT_COLORS[k] || '#6b6b8a');

      if (verdictChart) verdictChart.destroy();
      verdictChart = new Chart(document.getElementById('verdictChart'), {
        type: 'doughnut',
        data: { labels: vLabels, datasets: [{ data: vData, backgroundColor: vColors, borderWidth: 0 }] },
        options: { plugins: { legend: { labels: { color: '#e8e8f0', font: { family: 'Inter' } } } },
          animation: { animateRotate: true, duration: 800 } }
      });

      const cLabels = Object.keys(d.claim_type_distribution).map(k => k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()));
      const cData = Object.values(d.claim_type_distribution);
      if (claimChart) claimChart.destroy();
      claimChart = new Chart(document.getElementById('claimChart'), {
        type: 'bar',
        data: { labels: cLabels, datasets: [{
          data: cData, backgroundColor: 'rgba(108,99,255,0.5)',
          borderColor: '#6c63ff', borderWidth: 2, borderRadius: 8
        }]},
        options: {
          scales: { x: { ticks: { color: '#6b6b8a' }, grid: { color: 'rgba(255,255,255,0.03)' } },
            y: { ticks: { color: '#6b6b8a' }, grid: { color: 'rgba(255,255,255,0.05)' } } },
          plugins: { legend: { display: false } }
        }
      });
    }

    async function fetchFeed() {
      const r = await fetch('/api/dashboard/recent?limit=15');
      const items = await r.json();
      const feed = document.getElementById('feed');
      if (!items.length) { feed.innerHTML = '<p style="color:var(--muted);font-size:13px;">No checks yet. Send a forward to the bot!</p>'; return; }
      feed.innerHTML = items.map(item => `
        <div class="feed-item">
          <span class="verdict-badge badge-${item.verdict}">${item.verdict.replace(/_/g,' ')}</span>
          <span class="feed-claim">${item.claim || 'Image / Voice / Screenshot'}</span>
          <span class="feed-type">${item.message_type.replace(/_/g,' ')}</span>
          <span class="feed-latency">${(item.latency_ms/1000).toFixed(1)}s</span>
        </div>
      `).join('');
    }

    async function refresh() {
      await Promise.all([fetchStats(), fetchTrends(), fetchFeed()]);
    }

    refresh();
    setInterval(refresh, 10000); // refresh every 10 seconds
  </script>
</body>
</html>
