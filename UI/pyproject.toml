[project]
name = "satya"
version = "0.1.0"
description = "Satya — AI Forward-Checker for Viral Misinformation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-generativeai>=0.8.0",
    "transformers>=4.44.0",
    "torch>=2.0.0",
    "Pillow>=10.0.0",
    "google-search-results>=2.4.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "sqlmodel>=0.0.21",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "sse-starlette>=2.0.0",
    "aiofiles>=24.0.0",
    "SpeechRecognition>=3.10.0",
]

[project.optional-dependencies]
audio = [
    "openai-whisper>=20231117",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
